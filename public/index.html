<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening Food Delivery App...</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #fff7ed;
        color: #222;
        padding: 32px;
        text-align: center;
      }

      .card {
        max-width: 420px;
        margin: 60px auto;
        background: white;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }

      h1 {
        font-size: 22px;
      }

      p {
        color: #666;
      }

      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 18px;
        background: #f97316;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Opening Food Delivery App...</h1>
      <p>If the app does not open automatically, tap the button below.</p>
      <a id="openApp" href="#">Open App</a>
    </div>

    <script>
      const appLink = "fooddelivery://finishSignIn" + window.location.search;

      document.getElementById("openApp").href = appLink;

      setTimeout(() => {
        window.location.href = appLink;
      }, 300);
    </script>
  </body>
</html>
